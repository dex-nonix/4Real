name: Build Windows executable (PyInstaller)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build Windows .exe (Windows runner)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install pyinstaller

      - name: Install package (editable) and dependencies
        run: |
          # install package and its declared deps from pyproject
          pip install -e talki_app

      - name: Run PyInstaller (onefile, windowed)
        run: |
          mkdir -p build dist
          pyinstaller --noconfirm --clean \
            --onefile --windowed \
            --name talki-app \
            talki_app/__main__.py

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: talki-windows-exe
          path: dist/*.exe
          retention-days: 7

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-log
          path: build/*
          retention-days: 7
